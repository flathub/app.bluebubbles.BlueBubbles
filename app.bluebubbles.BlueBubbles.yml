app-id: app.bluebubbles.BlueBubbles
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: bluebubbles
separate-locales: false
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  - --system-talk-name=org.freedesktop.NetworkManager
  - --talk-name=org.freedesktop.FileManager1
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --env=NOTIFY_IGNORE_PORTAL=1
  - --share=network
modules:
  - 'shared-modules/libayatana-appindicator/libayatana-appindicator-gtk3.json'
  - name: xorg-libXmu
    sources:
      - type: git
        url: https://gitlab.freedesktop.org/xorg/lib/libxmu.git
        tag: libXmu-1.3.1
        commit: cdf280f6611932f79ab872832974e8043b1cad6d
  - name: wmctrl
    sources:
      - type: git
        url: https://github.com/dancor/wmctrl.git
        commit: 0181e8e4a7ed98255f6ef930875e56560f19aa95
  - name: objectbox
    buildsystem: simple
    build-commands:
      - cp -r libobjectbox.so /app/lib/
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://github.com/objectbox/objectbox-c/releases/download/v5.3.1/objectbox-linux-x64.tar.gz
        sha256: d1a22f5a43e8aa438c987524c2ef97f5d179acb991b0f63ab03a30c33b882368
      - type: archive
        only-arches:
          - aarch64
        url: https://github.com/objectbox/objectbox-c/releases/download/v5.3.1/objectbox-linux-aarch64.tar.gz
        sha256: 948fe456904b8b0ae6b22a26a9f460734dc3c2ec58750df3a329ccae1ebe035d
  - name: libidn
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://ftp.gnu.org/gnu/libidn/libidn-1.43.tar.gz
        sha256: bdc662c12d041b2539d0e638f3a6e741130cdb33a644ef3496963a443482d164
    cleanup:
      - /bin/*
      - /share/*
  - name: libmpv
    buildsystem: meson
    config-opts:
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dalsa=disabled
      - -Dmanpage-build=disabled
      # Build mpv like normal distro packages: assertions off (NDEBUG). The
      # default plain buildtype leaves them on, which turns a survivable bad
      # crop (e.g. WSLg's broken VDPAU frames) into a fatal abort.
      - -Db_ndebug=true
    build-options:
      libdir: /app/lib
    sources:
      - type: git
        url: https://github.com/mpv-player/mpv.git
        tag: v0.41.0
        commit: 41f6a645068483470267271e1d09966ca3b9f413
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
    modules:
      - name: nv-codec-headers
        no-autogen: true
        make-install-args:
          - PREFIX=/app
        sources:
          - type: git
            url: https://github.com/FFmpeg/nv-codec-headers.git
            tag: n13.0.19.0
            commit: e844e5b26f46bb77479f063029595293aa8f812d
            x-checker-data:
              type: git
              tag-pattern: ^n([\d.]+)$
        cleanup:
          - '*'
      - name: libass
        config-opts:
          - --disable-static
        sources:
          - type: git
            url: https://github.com/libass/libass.git
            tag: 0.17.4
            commit: bbb3c7f1570a4a021e52683f3fbdf74fe492ae84
            x-checker-data:
              type: git
              tag-pattern: ^([\d.]+)$
      - name: libplacebo
        buildsystem: meson
        config-opts:
          - -Dshaderc=enabled
          - -Dvulkan=enabled
          - -Dd3d11=disabled
          - -Ddemos=false
        build-options:
          libdir: /app/lib
        sources:
          - type: git
            url: https://code.videolan.org/videolan/libplacebo.git
            tag: v7.360.1
            commit: cee9b076f2c63104ccfd497fa79c39a867293ec4
            x-checker-data:
              type: git
              tag-pattern: ^v([\d.]+)$
        
  - name: fmedia
    buildsystem: simple
    only-arches:
      - x86_64
    build-commands:
      - mkdir -p /app/bin
      - cp -r fmedia-1 /app/bin
      - ln -s /app/bin/fmedia-1/fmedia /app/bin/fmedia
    sources:
      - type: archive
        dest: fmedia-1
        url: https://master.dl.sourceforge.net/project/fmedia/v1.23.1/fmedia-1.23.1-linux-amd64.tar.xz
        sha256: 14b181aef14addcfc08e23a9b47c9eba8d2d5359f90a6155a5254f501036a846
  - name: arp
    buildsystem: simple
    build-commands:
      - yes "" | make arp
      - install -Dm755 arp /app/bin/arp
    sources:
      - type: git
        url: https://github.com/ecki/net-tools.git
        tag: v2.10
        commit: 80d7b95067f1f22fece9537dea6dff53081f4886
  - name: bluebubbles
    buildsystem: simple
    build-commands:
      - cp -r bluebubbles /app/
      - mkdir -p /app/bin
      - ln -s /app/bluebubbles/bluebubbles /app/bin/bluebubbles
      - chmod +x /app/bluebubbles/bluebubbles
      - chmod +x /app/bin/bluebubbles
      - install -Dm644 app.bluebubbles.BlueBubbles.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 128x128.png /app/share/icons/hicolor/128x128/apps/${FLATPAK_ID}.png
      - install -Dm644 app.bluebubbles.BlueBubbles.desktop -t /app/share/applications/
    sources:
      - type: archive
        only-arches:
          - x86_64
        dest: bluebubbles
        url: https://github.com/BlueBubblesApp/bluebubbles-app/releases/download/v2.0.0%2B89/bluebubbles-linux-x86_64.tar.gz
        sha256: 75f6d31ba798f7c2c3de1ab94818b7ef3be8a14b8e014b0c9728f07b1018076a
      - type: archive
        only-arches:
          - aarch64
        dest: bluebubbles
        url: https://github.com/BlueBubblesApp/bluebubbles-app/releases/download/v2.0.0%2B89/bluebubbles-linux-aarch64.tar.gz
        sha256: 83debb7b908efc156590c18ebf39c49dc9579b5fb5d124e1fa0cd407e1b0e2cd
      - type: file
        url: https://raw.githubusercontent.com/BlueBubblesApp/bluebubbles-app/refs/tags/v2.0.0%2B89/flatpak/app.bluebubbles.BlueBubbles.metainfo.xml
        sha256: 5e7ff6b2bdf57f8f2f1d61fe40288690b41756f3c74777ad57d438d13fd8dfd6
      - type: file
        url: https://raw.githubusercontent.com/BlueBubblesApp/bluebubbles-app/refs/tags/v2.0.0%2B89/flatpak/icon/128x128.png
        sha256: 9fc90e23472662301346fa83255c4288c76e723464a2ed2896a46ead19cf320b
      - type: file
        url: https://raw.githubusercontent.com/BlueBubblesApp/bluebubbles-app/refs/tags/v2.0.0%2B89/flatpak/app.bluebubbles.BlueBubbles.desktop
        sha256: 575c8f4c1151f5a90e237094f3acef4197810f8d5dac02883931e9de9d6d9363
    cleanup:
      - /bluebubbles/data/flutter_assets/packages/media_kit/
      - /bluebubbles/data/flutter_assets/packages/record_web/
      - /bluebubbles/data/flutter_assets/packages/wakelock_plus/
  - name: pdfium
    buildsystem: simple
    build-commands:
      - mv libpdfium/libpdfium.so /app/bluebubbles/lib
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F7961/pdfium-linux-x64.tgz
        sha256: 019665c8877d46fe65f625f80fd714ab07aac68554b0636acf2a2adf9288adb2
        dest: libpdfium
      - type: archive
        only-arches:
          - aarch64
        url: https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F7961/pdfium-linux-arm64.tgz
        sha256: 974107999784a438149605024475d42d80dd306799d90e1af5f6fa63f976455f
        dest: libpdfium
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - /man

