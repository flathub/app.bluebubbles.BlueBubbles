name: Check for updates

# Replaces Flathub's hosted checker (disabled via flathub.json)
on:
  # Fired by bluebubbles-app's desktop-builds workflow
  repository_dispatch:
    types: [upstream-release]
  # Catches dependency bumps
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  flatpak-external-data-checker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: docker://ghcr.io/flathub/flatpak-external-data-checker:latest
        env:
          GIT_AUTHOR_NAME: BlueBubbles Bot
          GIT_COMMITTER_NAME: BlueBubbles Bot
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --update --never-fork app.bluebubbles.BlueBubbles.yml
